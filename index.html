<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIO SCRIPT NETWORK</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #050505;
        }
        .chat-container {
            width: 100%;
            max-width: 850px;
            height: 92vh;
            background: rgba(12, 12, 12, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: rgba(0, 0, 0, 0.6);
            padding: 18px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            text-transform: uppercase;
        }
        .chat-messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }
        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 10px;
            line-height: 1.5;
            word-wrap: break-word;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .bot {
            background: rgba(25, 25, 25, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.05);
            align-self: flex-start;
            border-left: 4px solid #ffffff;
            width: 100%;
        }
        .user {
            background: #ffffff;
            color: #000000;
            align-self: flex-end;
            font-weight: 500;
        }
        .game-title {
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 1.1rem;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }
        .hub-list {
            list-style-type: none;
            margin-top: 10px;
        }
        .hub-list li {
            padding: 6px 0;
            color: #b0b0b0;
        }
        .hub-list li::before {
            content: "• ";
            color: #ffffff;
            font-weight: bold;
        }
        .hub-name {
            color: #ffffff;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .hub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .copy-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 6px 14px;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .copy-btn:hover {
            background-color: #cccccc;
        }
        .copy-btn.copied {
            background-color: #28a745;
            color: #ffffff;
        }
        .script-box {
            background-color: #0a0a0a;
            color: #00ff66;
            font-family: 'Consolas', 'Courier New', monospace;
            padding: 14px;
            border-radius: 8px;
            white-space: pre-wrap;
            overflow-x: auto;
            font-size: 0.9rem;
            border: 1px solid #222;
        }
        .chat-input-area {
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .chat-input {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 18px;
            color: #ffffff;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
            transition: border 0.3s;
        }
        .chat-input:focus {
            border-color: #ffffff;
        }
        .chat-input::placeholder {
            color: #888888;
        }
        .chat-submit {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 0 28px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .chat-submit:hover {
            background-color: #dddddd;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">DIO SCRIPT SYSTEM</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot">Hệ thống sẵn sàng. Vui lòng nhập TÊN GAME để xem danh sách script.</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="chatInput" class="chat-input" placeholder="Nhập tên game hoặc tên script..." autocomplete="off">
        <button id="chatSubmit" class="chat-submit">SEND</button>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const chatSubmit = document.getElementById('chatSubmit');

    const GAMES_DATABASE = {
        "adopt me": {
            name: "Adopt Me",
            scripts: {
                "Axonic Hub": { mobile: `loadstring(game:HttpGet("https://raw.githubusercontent.com/Kenniel123/Slime-RNG/refs/heads/main/SlimeRNG"))()` },
                "Dead Hub": { mobile: `loadstring(game:HttpGet("https://raw.githubusercontent.com/DeadScripter/Deadhub/refs/heads/main/DeadLoader.lua"))()` },
                "Echo Hub": { mobile: `loadstring(game:HttpGet("https://vss.pandadevelopment.net/virtual/file/475911550cec4d6d"))()` },
                "JN Hub": { mobile: `loadstring(game:HttpGet("https://raw.githubusercontent.com/JNHHGaming/Slime-Rng/refs/heads/main/JN%20HH%20Gaming",true))()` },
                "Cryo Hub": { mobile: `loadstring(game:HttpGet("https://raw.githubusercontent.com/xlebaaa3-netizen/cryo/refs/heads/main/loader.luau"))()` },
                "PHANTOM Hub": { mobile: `loadstring(game:HttpGet("https://raw.githubusercontent.com/Dalkoski/Phantom/refs/heads/main/Loader"))()` },
                "Ajjans Hub": { mobile: `loadstring(game:HttpGet("https://api.luarmor.net/files/v4/loaders/359e97f8618e9008afe5f496184ebb7c.lua"))()` },
                "Ather Hub": { mobile: `loadstring(game:HttpGet("https://api.luarmor.net/files/v3/loaders/2529a5f9dfddd5523ca4e22f21cceffa.lua"))()` }
            }
        }
    };

    function copyScript(text, button) {
        navigator.clipboard.writeText(text).then(() => {
            button.innerText = "COPIED!";
            button.classList.add('copied');
            setTimeout(() => {
                button.innerText = "COPY SCRIPT";
                button.classList.remove('copied');
            }, 2000);
        }).catch(() => {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            button.innerText = "COPIED!";
            button.classList.add('copied');
            setTimeout(() => {
                button.innerText = "COPY SCRIPT";
                button.classList.remove('copied');
            }, 2000);
        });
    }

    function appendMessage(text, sender, type = 'text', dataPayload = null) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender);
        
        if (type === 'list' && dataPayload) {
            let htmlContent = `<div class="game-title">CÁC HỆ THỐNG SCRIPT: ${dataPayload.name}</div>`;
            htmlContent += `<div>Vui lòng gõ tên một trong các Script dưới đây để lấy mã:</div>`;
            htmlContent += `<ul class="hub-list">`;
            for (const hubName of Object.keys(dataPayload.scripts)) {
                htmlContent += `<li>${hubName}</li>`;
            }
            htmlContent += `</ul>`;
            msgDiv.innerHTML = htmlContent;
        } else if (type === 'script' && dataPayload) {
            let htmlContent = `
                <div class="hub-header">
                    <span class="hub-name">${dataPayload.hubName.toUpperCase()}</span>
                    <button class="copy-btn" id="btn-${Date.now()}">COPY SCRIPT</button>
                </div>
                <div class="script-box">${dataPayload.scriptContent}</div>
            `;
            msgDiv.innerHTML = htmlContent;
            
            setTimeout(() => {
                const btn = msgDiv.querySelector('.copy-btn');
                if (btn) {
                    btn.addEventListener('click', () => copyScript(dataPayload.scriptContent, btn));
                }
            }, 10);
        } else {
            msgDiv.innerText = text;
        }
        
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function handleSend() {
        const query = chatInput.value.trim().toLowerCase();
        if (!query) return;

        appendMessage(chatInput.value, 'user');
        chatInput.value = '';

        setTimeout(() => {
            let matchedGame = null;
            let matchedHubName = "";
            let matchedScriptContent = "";

            for (const [gameKey, gameModule] of Object.entries(GAMES_DATABASE)) {
                if (gameKey.includes(query) || (gameModule.name && gameModule.name.toLowerCase().includes(query))) {
                    matchedGame = gameModule;
                }
                
                for (const [hubName, hubData] of Object.entries(gameModule.scripts)) {
                    if (hubName.toLowerCase().includes(query)) {
                        matchedHubName = hubName;
                        matchedScriptContent = hubData.mobile;
                        matchedGame = null; 
                        break;
                    }
                }
                if (matchedScriptContent) break;
            }

            if (matchedScriptContent) {
                appendMessage('', 'bot', 'script', { hubName: matchedHubName, scriptContent: matchedScriptContent });
            } else if (matchedGame) {
                appendMessage('', 'bot', 'list', matchedGame);
            } else {
                appendMessage("Không tìm thấy dữ liệu. Hãy thử gõ tên game hoặc tên script cụ thể.", 'bot');
            }
        }, 200);
    }

    chatSubmit.addEventListener('click', handleSend);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSend();
    });
</script>

</body>
</html>
